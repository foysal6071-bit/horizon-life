name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write            # needed to create the Release

env:
  UNITY_VERSION: 2022.3.50f1 # change if you want another 2022.3 LTS version

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) unzip the project and add the files a bare "Assets only" zip is missing
      - name: Unzip and prepare Unity project
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Using $ZIP"
          mkdir -p unity
          unzip -q -o "$ZIP" -d unity
          test -d unity/Assets || { echo "Assets folder not found in zip"; exit 1; }
          mkdir -p unity/ProjectSettings unity/Packages
          echo "m_EditorVersion: $UNITY_VERSION" > unity/ProjectSettings/ProjectVersion.txt
          cat > unity/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.unity.render-pipelines.universal": "14.0.11",
              "com.unity.modules.androidjni": "1.0.0",
              "com.unity.modules.animation": "1.0.0",
              "com.unity.modules.audio": "1.0.0",
              "com.unity.modules.imageconversion": "1.0.0",
              "com.unity.modules.imgui": "1.0.0",
              "com.unity.modules.jsonserialize": "1.0.0",
              "com.unity.modules.physics": "1.0.0",
              "com.unity.modules.ui": "1.0.0"
            }
          }
          JSON

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-Android-${{ hashFiles('SunnyDriftCar_Unity_URP.zip', '*.zip') }}
          restore-keys: Library-Android-

      # 2) build the APK (CiBuild.Build creates URP asset + scene, applies settings)
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: CiBuild.Build
          buildName: SunnyDriftCar
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: SunnyDriftCar-Android
          path: build/Android/*.apk

      # 3) publish a GitHub Release with the APK attached
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sunny Drift Car v1.0.${{ github.run_number }}
          files: build/Android/*.apk
          generate_release_notes: true