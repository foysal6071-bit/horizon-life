name: Build & Release APK from ZIP

# রিপোর ROOT-এ SunnyDriftCar_vNN.zip পুশ করলেই চলবে (অথবা Actions ট্যাব থেকে Run workflow)।
on:
  push:
    paths: ['*.zip', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'কোন zip বিল্ড হবে (খালি রাখলে সবচেয়ে নতুন ভার্সন)'
        required: false
        default: ''

permissions:
  contents: write   # Release তৈরির জন্য

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick ZIP
        id: pick
        run: |
          set -euo pipefail
          Z="${{ github.event.inputs.zip_name }}"
          if [ -z "$Z" ]; then Z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1 || true); fi
          [ -n "$Z" ] && [ -f "$Z" ] || { echo "::error::রিপোর root-এ কোনো .zip পাওয়া যায়নি"; exit 1; }
          TAG=$(basename "$Z" .zip | sed 's/[^A-Za-z0-9._-]/_/g')
          echo "zip=$Z" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building: $Z  (tag: $TAG)"

      - name: Unzip
        id: unzip
        run: |
          set -euo pipefail
          rm -rf _src && mkdir _src
          unzip -q "${{ steps.pick.outputs.zip }}" -d _src
          # zip-এর ভেতরে settings.gradle যেখানে আছে সেটাই প্রজেক্ট root
          S=$(find _src -maxdepth 3 -name 'settings.gradle*' -not -path '*/node_modules/*' | head -n1)
          [ -n "$S" ] || { echo "::error::settings.gradle পাওয়া যায়নি"; exit 1; }
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }

      - name: Prepare signing key
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            P="$KS_PASS"; A="$KS_ALIAS"; KP="${KS_KEYPASS:-$KS_PASS}"
          else
            echo "::warning::KEYSTORE_BASE64 secret নেই — প্রতিবার নতুন temporary key দিয়ে সাইন হচ্ছে (আগের ভার্সনের ওপর update-install হবে না)।"
            P="android-ci-pass"; A="release"; KP="$P"
            keytool -genkeypair -v -keystore "$KS" -storepass "$P" -keypass "$KP" \
              -alias "$A" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SunnyDriftCar"
          fi
          echo "::add-mask::$P"; echo "::add-mask::$KP"
          {
            echo "KS_FILE=$KS"; echo "KS_PASS=$P"; echo "KS_ALIAS=$A"; echo "KS_KEYPASS=$KP"
          } >> "$GITHUB_ENV"

      - name: Patch project for optimized release
        working-directory: ${{ steps.unzip.outputs.dir }}
        env:
          RUN_NUMBER: ${{ github.run_number }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          p = 'app/build.gradle'
          s = open(p, encoding='utf-8').read()
          if 'buildTypes' not in s:
              block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('KS_FILE'))
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KS_ALIAS')
                      keyPassword System.getenv('KS_KEYPASS')
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      debuggable false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'ci-rules.pro'
                      signingConfig signingConfigs.release
                      ndk { debugSymbolLevel 'NONE' }
                  }
              }
          """
              s, n = re.subn(r'(\bandroid\s*\{)', lambda m: m.group(1) + block, s, count=1)
              assert n == 1, 'android { } block পাওয়া যায়নি'
          # version bump: versionCode = CI run number, versionName = zip নাম
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ['RUN_NUMBER'], s)
          s = re.sub(r"versionName\s+['\"][^'\"]*['\"]", "versionName '" + os.environ['TAG'] + "'", s)
          open(p, 'w', encoding='utf-8').write(s)
          open('app/ci-rules.pro', 'w').write(
              "-keepclasseswithmembernames class * { native <methods>; }\n"
              "-keep class com.sunny.car.MainActivity { *; }\n")
          PY

      - name: Build release APK
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: gradle assembleRelease -x lintVitalRelease --no-daemon --stacktrace

      - name: Verify & name the APK
        id: apk
        working-directory: ${{ steps.unzip.outputs.dir }}
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="$GITHUB_WORKSPACE/${{ steps.pick.outputs.tag }}-release.apk"
          cp "$SRC" "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose "$OUT" | head -n5
          (cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$OUT")" > "$(basename "$OUT").sha256")
          ls -lh "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pick.outputs.tag }}-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --target "$GITHUB_SHA" --title "Sunny Drift Car $TAG" \
              --notes "Optimized release APK (R8 minify + resource shrink, -O3 native, arm64-v8a + armeabi-v7a). Built from \`${{ steps.pick.outputs.zip }}\`."
          fi